<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keuangan Pribadi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOGIN PAGE -->
  <div id="loginPage" class="page">
    <div class="card login-card">
      <h1>💰 Keuangan</h1>
      <p>Catatan keuangan pribadi</p>

      <input id="password" type="password" placeholder="Password">
      <button onclick="login()">Masuk</button>

      <p id="authMessage" class="message"></p>
    </div>
  </div>

  <!-- APP PAGE -->
  <div id="appPage" class="page hidden">

    <header>
      <div>
        <h1>💰 Keuangan</h1>
        <p class="user-email">Pribadi</p>
      </div>
      <button class="logout" onclick="logout()">Keluar</button>
    </header>

    <main>

      <!-- PILIH / BUAT BULAN -->
      <section class="card">
        <h2>Bulan</h2>

        <select id="monthSelect" onchange="selectMonth()">
          <option value="">-- Pilih bulan --</option>
        </select>

        <div class="divider">atau buat baru</div>

        <input id="monthName" placeholder="Contoh: September 2026">
        <input id="openingCash" type="number" placeholder="Saldo Awal Cash">
        <input id="openingNonCash" type="number" placeholder="Saldo Awal Non-Cash">

        <button onclick="createMonth()">+ Buat Bulan Baru</button>
      </section>

      <!-- RINGKASAN -->
      <section class="card" id="summarySection" style="display:none;">
        <h2>Ringkasan <span id="currentMonthLabel"></span></h2>

        <div class="summary">
          <div>
            <small>Saldo Awal Cash</small>
            <strong id="openingCashDisplay">Rp0</strong>
          </div>
          <div>
            <small>Saldo Awal Non-Cash</small>
            <strong id="openingNonCashDisplay">Rp0</strong>
          </div>
          <div>
            <small>Cash Sekarang</small>
            <strong id="cash">Rp0</strong>
          </div>
          <div>
            <small>Non-Cash Sekarang</small>
            <strong id="nonCash">Rp0</strong>
          </div>
          <div>
            <small>Total Pengeluaran</small>
            <strong id="expenses" class="expense">Rp0</strong>
          </div>
          <div>
            <small>Total Saldo Sekarang</small>
            <strong id="ending">Rp0</strong>
          </div>
        </div>
      </section>

      <!-- TAMBAH TRANSAKSI -->
      <section class="card" id="transactionSection" style="display:none;">
        <h2>Tambah Transaksi</h2>

        <input id="transactionName" placeholder="Nama transaksi (contoh: Warteg)">
        <input id="transactionAmount" type="number" placeholder="Nominal">

        <select id="transactionType" onchange="toggleTransfer()">
          <option value="expense">Pengeluaran</option>
          <option value="transfer">Transfer Cash ↔ Non-Cash</option>
        </select>

        <div id="expenseFields">
          <select id="account">
            <option value="cash">Dari Cash</option>
            <option value="non_cash">Dari Non-Cash</option>
          </select>
        </div>

        <div id="transferFields" class="hidden">
          <select id="transferFrom">
            <option value="cash">Dari Cash</option>
            <option value="non_cash">Dari Non-Cash</option>
          </select>
          <select id="transferTo">
            <option value="non_cash">Ke Non-Cash</option>
            <option value="cash">Ke Cash</option>
          </select>
        </div>

        <button onclick="addTransaction()">Simpan Transaksi</button>
      </section>

      <!-- RIWAYAT -->
      <section class="card" id="historySection" style="display:none;">
        <h2>Riwayat Transaksi</h2>
        <div id="transactions">
          Belum ada transaksi.
        </div>
      </section>

    </main>
  </div>

  <!-- MODAL EDIT -->
  <div id="editModal" class="modal hidden">
    <div class="modal-content">
      <h3>Edit Transaksi</h3>
      <input id="editName" placeholder="Nama">
      <input id="editAmount" type="number" placeholder="Nominal">
      <button onclick="saveEdit()">Simpan</button>
      <button class="secondary" onclick="closeEdit()">Batal</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
